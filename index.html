<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webook of the Day ｜ 本の処方箋</title>
<style>
  :root{
    --bg:#16241C;
    --card:#1F3327;
    --sage:#8FAF7C;
    --sage-deep:#2F4A34;
    --clay:#E2825A;
    --ink:#EDE6D6;
    --line: rgba(237,230,214,0.15);
    --muted:#9FAE98;
    --muted-soft:#C7D0C0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","游ゴシック体","Yu Gothic",sans-serif;
    line-height:1.85;
    word-break:keep-all;
    overflow-wrap:anywhere;
  }
  .serif{ font-family:inherit; }
  a{ color:inherit; }
  .wrap{ max-width:1000px; margin:0 auto; padding:0 28px; }

  header{ padding:20px 0; border-bottom:2px solid var(--ink); }
  header .wrap{ display:flex; justify-content:space-between; align-items:center; }
  header .brand{ display:flex; align-items:center; gap:12px; }
  .brand-logo{ height:38px; width:auto; border-radius:6px; }
  .brand{ font-weight:900; font-size:20px; }
  .brand small{ font-weight:400; font-size:12px; display:block; color:var(--sage); letter-spacing:0.1em;}
  nav a{ margin-left:28px; font-size:18px; text-decoration:none; font-weight:700; }

  .hero{ padding:64px 0 60px; }
  .hero .wrap{ display:grid; grid-template-columns:1.3fr 0.9fr; gap:50px; align-items:center; }
  .rx-mark{ font-size:56px; font-weight:900; color:var(--sage); line-height:1; margin-bottom:18px; }
  .rx-mark img{ height:64px; width:auto; display:block; border-radius:8px; }
  .hero h1{ font-size:clamp(22px,7.5vw,68px); font-weight:900; margin:0 0 22px; line-height:1.4; }
  .hero h1 .line{ display:block; white-space:nowrap; }
  .hero p{ font-size:15px; color:var(--muted-soft); max-width:44ch; }

  .rx-card{
    background:var(--card); border:1.5px solid var(--ink); border-radius:6px; padding:30px;
    box-shadow:6px 6px 0 var(--sage);
  }
  .rx-card .head{ display:flex; justify-content:space-between; border-bottom:1px dashed var(--line); padding-bottom:14px; margin-bottom:16px; }
  .rx-card .head b{ font-size:13px; }
  .rx-line{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; color:var(--muted-soft); gap:12px; }
  .rx-line span{ white-space:nowrap; flex-shrink:0; }
  .rx-line b{ color:var(--ink); }
  .rx-card .rx-title{ font-size:19px; margin:14px 0 6px; font-weight:700; white-space:nowrap; }
  .rx-dose{ font-size:12.5px; color:var(--clay); background:rgba(226,130,90,0.15); padding:8px 12px; border-radius:4px; margin-top:14px; }

  .section{ padding:74px 0; border-top:1px solid var(--line); }
  .eyebrow{ font-size:12.5px; font-weight:700; color:var(--clay); margin-bottom:10px; }
  .section h2{ font-size:27px; margin:0 0 44px; font-weight:900; }

  .rx-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  .rx-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:26px; }
  .symptom{ font-size:12.5px; color:var(--sage); font-weight:700; margin-bottom:10px; }
  .rx-item h3{ font-size:18px; margin:0 0 4px; font-weight:700; }
  .rx-item .by{ font-size:12.5px; color:var(--muted); margin-bottom:14px; }
  .rx-item p{ font-size:13.5px; color:var(--muted-soft); margin:0 0 16px; }
  .dose-tag{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; background:rgba(143,175,124,0.18); color:var(--sage); padding:5px 10px; border-radius:20px; font-weight:700; }
  .rx-item{ cursor:pointer; transition:transform .15s ease, border-color .15s ease; }
  .rx-item:hover{ transform:translateY(-4px); border-color:var(--sage); }
  .read-more{ display:block; margin-top:14px; font-size:12.5px; color:var(--clay); font-weight:700; }

  .cover{
    width:60px; height:84px; border-radius:3px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:#fff; font-size:10.5px; font-weight:700; line-height:1.3; padding:6px;
    box-shadow:3px 3px 0 rgba(0,0,0,0.28);
  }
  .cover-1{ background:linear-gradient(135deg,#8FAF7C,#4F5C42); }
  .cover-2{ background:linear-gradient(135deg,#7C93A8,#39495A); }
  .cover-3{ background:linear-gradient(135deg,#E2825A,#9C4E2F); }
  .cover-lg{ width:96px; height:134px; font-size:13px; }
  .cover-img{ object-fit:contain; padding:0; background:var(--card); }
  .rx-top{ display:flex; gap:16px; align-items:flex-start; margin-bottom:14px; }
  .card-actions{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .amazon-btn{ font-size:12px; font-weight:700; color:var(--clay); text-decoration:none; border-bottom:1px solid var(--clay); padding-bottom:1px; }
  .amazon-btn:hover{ opacity:0.8; }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(10,16,12,0.72);
    z-index:100; padding:40px 20px; overflow-y:auto;
  }
  .modal-overlay.open{ display:block; }
  .modal{
    max-width:640px; margin:0 auto; background:var(--card); border:1.5px solid var(--ink);
    border-radius:10px; padding:40px;
